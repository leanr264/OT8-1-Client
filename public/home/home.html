<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../home/home.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
    <title>Alkywallet</title>
  </head>
  <body>
    <header>
      <div
        class="container d-flex justify-content-end align-items-center h-100"
      >
        <a class="color-white" href="http://localhost:3000/home"
          ><i class="bi bi-house-door-fill px-3"> </i
        ></a>

        <a class="color-white" href="http://localhost:3000/profile"
          ><i class="bi bi-person-circle px-3"></i
        ></a>
        <button class="btn-logout" id="btn-logout">
          <i class="bi bi-box-arrow-right px-3"></i>
        </button>
      </div>
    </header>
    <main>
      <div class="container info-container">
        <div class="row">
          <div class="col">
            <div class="container cuentas-container">
              <div class="row">
                <div class="account-container">
                  <div class="row account-header">
                    <div class="row">
                      <div class="col-8">
                        <h5 id="accountArs-Title">Cuenta en Pesos</h5>
                      </div>
                      <div class="col d-flex justify-content-end">
                        <button class="account-btn" id="updateArs">
                          Editar
                        </button>
                      </div>
                    </div>
                    <div class="row color-99 cvu">
                      <div class="col">
                        <span>CVU :</span>
                        <span id="accountArs-CVU">000000000000</span>
                      </div>
                    </div>
                  </div>
                  <div class="row account-balance">
                    <div class="row color-99">
                      <div class="col">Dinero disponible:</div>
                    </div>
                    <div class="row balance">
                      <div class="col">
                        <span>AR$ </span
                        ><span id="accountArs-Balance">10.000,70</span>
                      </div>
                    </div>
                  </div>
                  <div
                    class="row account-actions d-flex flex-column align-items-center justify-content-evenly"
                  >
                    <div class="col my-1">
                      <button class="account-btn action-btn" id="depositArs">
                        Ingresar dinero
                      </button>
                    </div>
                    <div class="col my-1">
                      <button class="account-btn action-btn" id="sendArs">
                        Transferir dinero
                      </button>
                    </div>
                    <div class="col my-1">
                      <button class="account-btn action-btn" id="paymentArs">
                        Hacer un pago
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row mt-4">
                <div class="account-container">
                  <div class="row account-header">
                    <div class="row">
                      <div class="col-8">
                        <h5 id="accountArs-Title">Cuenta en Dolares</h5>
                      </div>
                      <div class="col d-flex justify-content-end">
                        <button class="account-btn" id="updateUsd">
                          Editar
                        </button>
                      </div>
                    </div>
                    <div class="row color-99 cvu">
                      <div class="col">
                        <span>CVU :</span>
                        <span id="accountUsd-CVU">000000000000</span>
                      </div>
                    </div>
                  </div>
                  <div class="row account-balance">
                    <div class="row color-99">
                      <div class="col">Dinero disponible:</div>
                    </div>
                    <div class="row balance">
                      <div class="col">
                        <span>US$ </span
                        ><span id="accountUsd-Balance">10.000,70</span>
                      </div>
                    </div>
                  </div>
                  <div
                    class="row account-actions d-flex flex-column align-items-center justify-content-evenly"
                  >
                    <div class="col my-1">
                      <button class="account-btn action-btn" id="depositUsd">
                        Ingresar dinero
                      </button>
                    </div>
                    <div class="col my-1">
                      <button class="account-btn action-btn" id="sendUsd">
                        Transferir dinero
                      </button>
                    </div>
                    <div class="col my-1">
                      <button class="account-btn action-btn" id="paymentUsd">
                        Hacer un pago
                      </button>
                    </div>
                    <div class="col my-1">
                      <button class="account-btn action-btn" id="buyUsd">
                        Comprar
                      </button>
                    </div>
                    <div class="col my-1">
                      <button class="account-btn action-btn" id="sellUsd">
                        Vender
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="container simulate-container mt-4 p-3">
              <a
                class="d-flex align-items-center justify-content-start"
                href="http://localhost:3000/fixed"
                ><i class="bi bi-cash-coin"></i>
                <p class="px-2">Simular un Plazo Fijo</p></a
              >
            </div>
            <div class="container simulate-container mt-2 p-3">
              <a
                class="d-flex align-items-center justify-content-start"
                href="http://localhost:3000/loan"
                ><i class="bi bi-cash-coin"></i>
                <p class="px-2">Simular un Prestamo</p>
              </a>
            </div>
          </div>
          <div class="col">
            <div class="container actividad-container">
              <div class="row actividad-title"><h3>Tu Actividad</h3></div>
              <div class="row container mt-2" id="transaction-list"></div>
              <div class="row">
                <div
                  class="col d-flex justify-content-center btn-mas-container"
                >
                  <button class="btn-mas" id="btn-mas">Ver mas</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div
        class="container d-flex flex-column justify-content-center align-items-center h-100"
      >
        <span>Track 8 - Squad 2</span>
        <div class="div">
          <i class="bi bi-github px-2"
            ><a
              class="color-blue"
              href="https://github.com/alkemyTech/OT8-1-Client"
              >Front</a
            ></i
          >
          <i class="bi bi-github px-2"
            ><a
              class="color-blue"
              href="https://github.com/alkemyTech/OT8-2-Server"
              >Back</a
            ></i
          >
        </div>
      </div>
    </footer>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../home/home.js"></script>
</html>
